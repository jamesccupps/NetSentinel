name: release

# Builds NetSentinel.exe on Windows. Pushing a v* tag publishes it, with a
# SHA-256 checksum and the updater's signature, on that tag's GitHub release; a
# manual run only keeps it as a workflow artifact, for trying a build without
# releasing it.
#
# Three jobs, so the signing key and the write token never share a job with
# third-party code. build installs every dependency, pinned by hash, with no
# secret and a read-only token; sign installs only cryptography, pinned by hash,
# and is the one job that sees the key; publish has the write token and installs
# nothing. The key signs every one-click update of an Administrator exe, so a
# compromised package must not be able to read it, and actions are pinned by
# commit for the same reason.
#
# Refresh the locks with pip-tools on Windows, Python 3.12:
#   pip-compile --allow-unsafe --generate-hashes --strip-extras --no-emit-index-url -o requirements-build.lock requirements.txt
#   pip-compile --allow-unsafe --generate-hashes --no-emit-index-url -o tools/sign-requirements.lock tools/sign-requirements.in
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'

      - name: Install dependencies (pinned by hash)
        run: python -m pip install --require-hashes -r requirements-build.lock

      - name: Build
        shell: cmd
        run: call build_exe.bat

      - name: Check the build and write its checksum
        shell: pwsh
        run: |
          if (-not (Test-Path dist\NetSentinel.exe)) { throw "the build produced no dist\NetSentinel.exe" }
          $hash = (Get-FileHash dist\NetSentinel.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  NetSentinel.exe" | Out-File -Encoding ascii dist\NetSentinel.exe.sha256
          Get-Item dist\NetSentinel.exe | Format-Table Name, Length

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: unsigned
          path: |
            dist/NetSentinel.exe
            dist/NetSentinel.exe.sha256
          if-no-files-found: error

  sign:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6
        with:
          name: unsigned
          path: dist

      - name: Install the signing tool's one dependency (pinned by hash)
        run: python -m pip install --require-hashes -r tools/sign-requirements.lock

      # The updater installs only what this signs (src/updater.py). A release
      # without the key fails here rather than ship something it cannot install.
      - name: Sign the build for the updater
        env:
          NETSENTINEL_SIGNING_KEY: ${{ secrets.NETSENTINEL_SIGNING_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          if [ -z "$NETSENTINEL_SIGNING_KEY" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::The NETSENTINEL_SIGNING_KEY secret is not set, so this release cannot be signed."
              exit 1
            fi
            echo "::warning::NETSENTINEL_SIGNING_KEY is not set; this build is not signed."
            exit 0
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python tools/sign_release.py sign dist/NetSentinel.exe --tag "$GITHUB_REF_NAME"
          else
            python tools/sign_release.py sign dist/NetSentinel.exe
          fi

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: NetSentinel-exe
          path: |
            dist/NetSentinel.exe
            dist/NetSentinel.exe.sha256
            dist/NetSentinel.exe.sig
          if-no-files-found: error

  publish:
    needs: sign
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6
        with:
          name: NetSentinel-exe
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PYTHONIOENCODING: utf-8
        run: |
          test -f dist/NetSentinel.exe.sig || { echo "::error::the build was not signed"; exit 1; }
          python3 tools/release_notes.py "$TAG" > notes.md
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "NetSentinel $TAG" --notes-file notes.md
          # No --clobber: once a release is out, Scoop has its hash and installs
          # have its signature, so a re-run on a released tag must fail rather
          # than swap in a rebuilt exe. A bad release gets a new version.
          gh release upload "$TAG" dist/NetSentinel.exe dist/NetSentinel.exe.sha256 \
            dist/NetSentinel.exe.sig
