name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Reading the code is all these jobs do.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pyinstaller is a build-time tool, not needed to run the tests
          pip install scapy psutil scikit-learn numpy cryptography pyyaml coverage maxminddb "py7zr>=1.1.3" python-evtx pystray pillow

      - name: Unit and regression tests
        shell: bash
        run: |
          set -o pipefail
          python -m coverage run --source=src -m unittest discover -s . -p "test_*.py" -v 2>&1 | tee test-output.txt

      # The log needs a GitHub sign-in; annotations are public.
      - name: Annotate failing tests
        if: failure()
        shell: bash
        run: python tools/ci_failures.py test-output.txt

      - name: Integration check
        run: python tools/integration_check.py

      - name: Coverage report
        run: python -m coverage report --sort=cover

  # The exe ships for Windows, and Windows broke code that passed here: files
  # opened in the ANSI code page, POSIX file modes, and a socket closed with
  # unread data resetting the connection. One version (the exe's) catches those.
  test-windows:
    runs-on: windows-latest
    env:
      # Only for the console, which is cp1252 when piped. Not PYTHONUTF8: that
      # would also change open()'s default and hide the bugs this job is for.
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scapy psutil scikit-learn numpy cryptography pyyaml maxminddb "py7zr>=1.1.3" python-evtx pystray pillow

      - name: Unit and regression tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s . -p "test_*.py" -v 2>&1 | tee test-output.txt

      - name: Annotate failing tests
        if: failure()
        shell: bash
        run: python tools/ci_failures.py test-output.txt

      - name: Integration check
        run: python tools/integration_check.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
      - run: pip install ruff
      # Syntax errors, undefined names, unused imports and variables fail the
      # build; style is advisory.
      - run: ruff check --select E9,F63,F7,F82,F401,F841 .
      - run: ruff check . || true
